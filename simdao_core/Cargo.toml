[package]
name = "simdao_core"
version = "0.1.0"
edition = "2021"
description = "Rust core of the Sim Dao (tiandao) engine, exposed to Python through PyO3"

[lib]
name = "simdao_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.28", features = ["abi3-py310"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
