<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>บันทึกผู้มีจิตใจ · SimDao</title>
<style>
:root{color-scheme:dark;--bg:#141a1c;--panel:#1b2325;--line:#39413f;--text:#e8e5dd;--muted:#a6b1ad;--gold:#dcbe86;--jade:#8fc2a8;--red:#e39a8b;--blue:#9bb8d6;font-family:Tahoma,"Noto Sans Thai",sans-serif;color:var(--text);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;background:var(--bg)}button,input{font:inherit;background:#293436;color:inherit;border:1px solid #50605e;border-radius:6px;padding:8px 10px}button{padding:8px 14px;cursor:pointer}button:disabled{opacity:.45;cursor:default}input{width:76px}a{color:var(--gold)}
header{padding:18px 4vw;border-bottom:1px solid var(--line);display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header strong{font-size:21px;font-weight:400}header small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#pill{font-size:13px;padding:4px 10px;border-radius:99px;border:1px solid #50605e;color:var(--muted)}#pill.running{color:var(--jade);border-color:#4f7c67}#pill.error{color:var(--red);border-color:#8a5046}
.control{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}.primary{border-color:#8b744b;color:var(--gold)}#novelState{color:var(--jade);font-size:13px}
#activity{font-size:13px;color:#c7b88e;min-height:18px;padding:6px 4vw;border-bottom:1px solid var(--line)}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1400px;margin:0 auto}
aside{border-right:1px solid var(--line);height:calc(100vh - 110px);overflow:auto;position:sticky;top:0;padding:10px 0}
aside h2{font-size:14px;font-weight:400;color:var(--muted);padding:6px 18px;margin:8px 0 2px}
.who{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;border-radius:0;padding:9px 16px;line-height:1.55}
.who:hover{background:#1f292b}.who[aria-current=true]{background:#243033;border-left-color:var(--gold)}
.who b{font-weight:400}.who small{display:block;color:var(--muted);font-size:12px}.who.dead{opacity:.55}
.emo{display:inline-block;font-size:11px;padding:0 7px;border-radius:99px;background:#2d3a3a;color:#cfd8cf;margin-left:6px;vertical-align:1px}
main{padding:24px 38px 90px;min-width:0}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.tabs button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 22px;margin-bottom:16px}
.profile h1{font-size:26px;font-weight:400;margin:0 0 4px}.profile .id{color:var(--muted);font-size:14px}
.goal{margin:12px 0 0;line-height:1.8}.goal span{color:var(--muted);font-size:13px;display:inline-block;min-width:110px}
.thought{font-style:italic;color:#e7dcc2;border-left:2px solid #7f7657;padding:4px 0 4px 14px;margin:10px 0;line-height:1.9}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid2 h3{font-size:14px;font-weight:400;color:var(--muted);margin:4px 0 8px}
.kv{font-size:14px;line-height:1.85}.kv div span{color:var(--muted);display:inline-block;min-width:88px}
ul.plain{margin:0;padding-left:18px;font-size:14px;line-height:1.85}
.feed{max-width:860px}
.entry{position:relative;padding:14px 0 16px 22px;border-left:1px solid #3b4644;margin-left:6px}
.entry::before{content:"";position:absolute;left:-5px;top:20px;width:9px;height:9px;border-radius:50%;background:#56645f}
.entry.decision::before{background:var(--gold)}.entry.received::before{background:var(--red)}.entry.death::before{background:#aaa;box-shadow:0 0 0 3px #555}.entry.join::before{background:var(--jade)}
.meta{font-size:12.5px;color:var(--muted)}.meta a{cursor:pointer;text-decoration:none}.src{font-size:11px;border:1px solid #50605e;border-radius:99px;padding:0 7px;margin-left:6px}
.src.new{color:var(--gold);border-color:#7f7657}.src.plan{color:var(--blue);border-color:#4d6680}.src.instinct{color:#b9a3c9;border-color:#6d5a7a}.src.fate{color:var(--red)}
.act{font-size:16px;margin:6px 0 2px;line-height:1.7}.act b{font-weight:400;color:var(--gold)}
.why{color:#cfc7b4;font-size:14px;line-height:1.7}.res{font-size:15px;line-height:1.8;margin-top:4px}.res em{font-style:normal;color:var(--jade)}
.res.bad em{color:var(--red)}.side{font-size:13px;color:var(--muted);line-height:1.7;margin-top:4px}
.chips{margin-top:6px}.chip{display:inline-block;font-size:12px;color:#c9cfca;background:#232d2f;border-radius:5px;padding:1px 8px;margin:2px 4px 2px 0}
details.story{margin-top:8px}details.story summary{cursor:pointer;color:var(--gold);font-size:13.5px}
details.story div{font-size:17px;line-height:2.05;white-space:pre-wrap;margin-top:8px;max-width:760px}
.planref{font-size:13px;color:var(--blue);margin-top:2px}
#more{margin:20px 0 0 28px}.empty{color:var(--muted);line-height:1.9;padding:30px 0}
.stats{font-size:13px;color:var(--muted)}
@media(max-width:820px){.layout{display:block}aside{position:static;height:auto;max-height:260px;border-right:0;border-bottom:1px solid var(--line)}main{padding:18px 16px 70px}.grid2{grid-template-columns:1fr}}
</style></head><body>
<header>
  <div><strong>บันทึกผู้มีจิตใจ</strong><small id="sub">ตัวละครคิดเอง ตัดสินใจเอง — วิถีสวรรค์เป็นผู้ตัดสินผล</small></div>
  <div class="actions"><span id="pill">…</span><span class="stats" id="stats"></span>
    <label class="control">รัน <input id="minutes" type="number" min="0.1" max="10080" step="0.5" value="25"> นาที</label>
    <label class="control">ผู้มีจิตใจ <input id="mindCount" type="number" min="1" max="200" value="9"> คน</label>
    <label class="control">นิยาย <input id="chapters" type="number" min="1" max="30" value="6"> บท</label>
    <button class="primary" id="start">เดินโลกตามเวลานี้</button><button id="stop">พักโลก</button></div>
</header>
<div id="activity"></div><div id="novelState" style="padding:0 4vw 7px"></div>
<div class="layout">
  <aside><h2>ผู้มีจิตใจ</h2><div id="alive"></div><h2>ผู้ล่วงลับ</h2><div id="dead"></div></aside>
  <main>
    <div class="tabs"><button id="allBtn" aria-pressed="true">ความเคลื่อนไหวทั้งหมด</button>
      <button id="decBtn" aria-pressed="false">เฉพาะการตัดสินใจ</button>
      <button id="storyBtn" aria-pressed="false">เฉพาะที่มีเรื่องเล่า</button></div>
    <div id="profile"></div>
    <div class="feed" id="feed"></div>
    <button id="more" hidden>ย้อนดูก่อนหน้า</button>
  </main>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let selected=null, filter='all', entries=[], oldest=null, lastTop=null, minds=[], controlsReady=false;
const BAD=/ตาย|พ่าย|แพ้|ล้มเหลว|บาดเจ็บ|ไม่พบ|ถูกปล้น|พลาด|หักหลัง|เสีย/;

async function api(path,opt){const r=await fetch(path,opt);if(!r.ok)throw new Error(await r.text());return r.json()}

function srcBadge(s){const m={'คิดใหม่':'new','ตามแผน':'plan','สัญชาตญาณ':'instinct','ชะตาฟ้า':'fate'};return s?`<span class="src ${m[s]||''}">${esc(s)}</span>`:''}
function nameLink(name,cid){return cid==null?esc(name):`<a data-cid="${cid}">${esc(name)}</a>`}

function renderEntry(e){
  const where=`ปีที่ ${e.year} · ${esc(e.place||'')}`;
  if(e.type==='decision'){
    const who=e.target?` กับ ${nameLink(e.target,e.target_cid)}`:'';
    const dest=e.dest?` → ${esc(e.dest)}`:'';
    const bad=BAD.test(e.outcome)?' bad':'';
    const chips=Object.entries(e.details||{}).filter(([k])=>!['margin','winner'].includes(k)).slice(0,6)
      .map(([k,v])=>`<span class="chip">${esc(k)}: ${esc(v)}</span>`).join('');
    return `<div class="entry decision"><div class="meta">${nameLink(e.name,e.cid)} · ${esc(e.realm||'')} · ${where}${srcBadge(e.source)}${e.emotion?` <span class="emo">${esc(e.emotion)}</span>`:''}</div>
      ${e.thought?`<div class="thought">“${esc(e.thought)}”</div>`:''}
      ${e.source==='ตามแผน'&&e.plan_thought?`<div class="planref">ทำตามแผนที่ตั้งใจไว้: “${esc(e.plan_thought.slice(0,140))}${e.plan_thought.length>140?'…':''}”</div>`:''}
      <div class="act">ตัดสินใจ <b>${esc(e.action)}</b>${who}${dest}</div>
      ${e.why?`<div class="why">เพราะ ${esc(e.why)}</div>`:''}
      <div class="res${bad}"><em>${esc(e.outcome)}</em> — ${esc(e.text)}</div>
      ${e.side&&e.side.length?`<div class="side">ตามมาด้วย: ${e.side.map(esc).join(' / ')}</div>`:''}
      ${chips?`<div class="chips">${chips}</div>`:''}
      ${e.error?`<div class="side">⚠ ${esc(e.error)}</div>`:''}
      ${e.story?`<details class="story"><summary>อ่านเป็นเรื่องเล่า</summary><div>${esc(e.story)}</div></details>`:''}</div>`;
  }
  if(e.type==='received') return `<div class="entry received"><div class="meta">${where}</div>
      <div class="res">${nameLink(e.by,e.by_cid)} <b>${esc(e.action)}</b> ต่อ ${nameLink(e.name,e.cid)} — <em>${esc(e.outcome)}</em>: ${esc(e.text)}</div></div>`;
  if(e.type==='death') return `<div class="entry death"><div class="meta">ปีที่ ${e.year}</div>
      <div class="act">✝ ${nameLink(e.name,e.cid)} สิ้นชีวิตในวัย ${esc(e.age)} ปี</div><div class="why">${esc(e.text)}</div>
      ${e.long_goal?`<div class="side">เป้าหมายที่ไม่ทันได้ไปถึง: ${esc(e.long_goal)}</div>`:''}</div>`;
  if(e.type==='join') return `<div class="entry join"><div class="meta">ปีที่ ${e.year} · ${esc(e.place||'')}</div>
      <div class="act">✦ ${nameLink(e.name,e.cid)} ตื่นรู้มีจิตใจเป็นของตัวเอง</div><div class="why">${esc(e.identity||'')}${e.text.includes('—')?' · '+esc(e.text.split('—').slice(1).join('—')):''}</div></div>`;
  return `<div class="entry"><div class="meta">${where}</div><div class="res">${nameLink(e.name,e.cid)}: ${esc(e.text)}</div></div>`;
}

function visible(list){
  if(filter==='decision')return list.filter(e=>e.type==='decision'&&e.source!=='ตามแผน'||e.type==='death');
  if(filter==='story')return list.filter(e=>e.story);
  return list;
}
function drawFeed(){
  const list=visible(entries);
  $('feed').innerHTML=list.length?list.map(renderEntry).join(''):`<div class="empty">ยังไม่มีบันทึก — กด “เดินโลกต่อ” แล้วรอให้ตัวละครเริ่มคิด<br>ครั้งแรกโมเดลอาจใช้เวลาโหลดสักครู่</div>`;
  $('more').hidden=entries.length<100;
}
async function loadFeed(reset){
  const q=new URLSearchParams({limit:'150'});
  if(selected!=null)q.set('cid',selected);
  if(!reset&&oldest!=null)q.set('before',oldest);
  const got=await api('/api/journal?'+q);
  entries=reset?got:entries.concat(got);
  oldest=entries.length?Math.min(...entries.map(e=>e.seq)):null;
  lastTop=entries.length?entries[0].id+':'+(entries[0].story?1:0):null;
  drawFeed();
}
async function refreshFeedIfNew(){
  const q=new URLSearchParams({limit:'1'});if(selected!=null)q.set('cid',selected);
  const top=await api('/api/journal?'+q);
  const key=top.length?top[0].id+':'+(top[0].story?1:0):null;
  if(key!==lastTop){await loadFeed(true);if(selected!=null)loadProfile();}
}

function drawMinds(){
  const row=m=>`<button class="who${m.alive?'':' dead'}" data-cid="${m.cid}" aria-current="${m.cid===selected}">
    <b>${esc(m.name)}</b>${m.emotion&&m.alive?`<span class="emo">${esc(m.emotion)}</span>`:''}
    <small>${esc(m.race)} · ${esc(m.realm)} · อายุ ${m.age}${m.org?' · '+esc(m.org):''}</small>
    <small>${m.alive?esc(m.short_goal||m.place):'✝ '+esc(m.death_cause)}</small></button>`;
  $('alive').innerHTML=minds.filter(m=>m.alive).map(row).join('')||'<div class="empty" style="padding:10px 18px">ยังไม่มี</div>';
  $('dead').innerHTML=minds.filter(m=>!m.alive).map(row).join('');
}
async function loadProfile(){
  if(selected==null){$('profile').innerHTML='';return}
  const p=await api('/api/mind/'+selected);
  const sheet=Object.entries(p.sheet).map(([k,v])=>`<div><span>${esc(k)}</span>${esc(v)}</div>`).join('');
  const plan=(p.plan||[]).map(s=>`<li>${esc(s.kind)}${s.target_name?' กับ '+esc(s.target_name):''}${s.why?' — '+esc(s.why):''}</li>`).join('');
  const imp=(p.impressions||[]).map(i=>`<li>${nameLink(i.name,i.is_mind?i.cid:null)}: ${esc(i.feeling)}</li>`).join('');
  $('profile').innerHTML=`<div class="card profile">
    <h1>${esc(p.name)} ${p.alive?'':'<small style="color:var(--muted)">(ล่วงลับ)</small>'}</h1>
    <div class="id">${esc(p.identity)} · อยู่ที่ ${esc(p.place)} · ตื่นรู้ปีที่ ${p.joined_year}${p.origin_note?' · '+esc(p.origin_note):''}</div>
    <div class="goal"><span>เป้าหมายชีวิต</span>${esc(p.long_goal||'ยังไม่ได้ตั้ง')}</div>
    <div class="goal"><span>ตั้งใจช่วงนี้</span>${esc(p.short_goal||'-')} ${p.emotion?`<span class="emo">${esc(p.emotion)}</span>`:''}</div>
    ${p.thought?`<div class="thought">“${esc(p.thought)}”</div>`:''}
    ${p.error?`<div class="side">⚠ ครั้งล่าสุดคิดไม่สำเร็จ: ${esc(p.error)}</div>`:''}
    <p style="margin:12px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="primary" data-novel-cid="${p.cid}">แต่งนิยายจากชีวิตคนนี้</button>
      <a href="/api/mind/${p.cid}/biography.md">ดาวน์โหลดชีวประวัติ (.md)</a></p></div>
    <div class="grid2">
      <div class="card"><h3>ตัวตน</h3><div class="kv">${sheet}</div></div>
      <div class="card"><h3>แผนที่ยังค้าง</h3>${plan?`<ol class="plain">${plan}</ol>`:'<div class="stats">ยังไม่มี</div>'}
        <h3 style="margin-top:14px">คนสำคัญในชีวิต</h3>${p.ties.length?`<ul class="plain">${p.ties.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'<div class="stats">ยังไม่มี</div>'}
        <h3 style="margin-top:14px">ความรู้สึกต่อผู้อื่น</h3>${imp?`<ul class="plain">${imp}</ul>`:'<div class="stats">ยังไม่มี</div>'}</div>
    </div>`;
}
async function select(cid){
  selected=cid;drawMinds();window.scrollTo({top:0});
  await Promise.all([loadProfile(),loadFeed(true)]);
}
async function tick(){
  try{
    const [s,nv]=await Promise.all([api('/api/status'),api('/api/novel/status')]);
    minds=s.minds||[];drawMinds();
    $('pill').textContent={running:'โลกกำลังเดิน',stopping:'กำลังพัก…',idle:'พักอยู่',error:'ผิดพลาด'}[s.state]||s.state;
    $('pill').className=s.state;
    $('start').disabled=s.state==='running'||s.state==='stopping';$('stop').disabled=s.state!=='running';
    const st=s.stats||{};
    $('stats').textContent=s.year!=null?`ปีที่ ${s.year} · คิด ${st.thinks||0} · ตามแผน ${st.plan_steps||0} · สัญชาตญาณ ${st.instinct||0} · เรื่องเล่า ${st.stories||0}`:'';
    $('sub').textContent=s.backend&&s.backend.model?`โมเดล ${s.backend.model} (${s.backend.provider}) · ตัวละครคิดเอง วิถีสวรรค์ตัดสินผล`:$('sub').textContent;
    $('activity').textContent=s.error?('⚠ '+s.error):(s.activity||s.message||'');
    if(!controlsReady&&s.limits){$('minutes').value=s.limits.minutes||25;$('mindCount').value=s.limits.mind_count||9;controlsReady=true;}
    const progress=nv.chapters?` (${nv.chapter}/${nv.chapters} บท)`:'';
    $('novelState').innerHTML=(nv.message?esc(nv.message)+progress:'')+(nv.error?` · ⚠ ${esc(nv.error)}`:'')+
      (nv.download?` · <a href="${nv.download}">ดาวน์โหลดนิยาย</a>`:'');
    document.querySelectorAll('[data-novel-cid]').forEach(b=>b.disabled=s.state==='running'||s.state==='stopping'||nv.state==='running'||nv.state==='stopping');
    await refreshFeedIfNew();
  }catch(err){$('activity').textContent='⚠ '+err.message}
}
document.addEventListener('click',ev=>{
  const n=ev.target.closest('[data-novel-cid]');if(n){ev.preventDefault();writeNovel(Number(n.dataset.novelCid));return;}
  const a=ev.target.closest('[data-cid]');if(a){ev.preventDefault();select(Number(a.dataset.cid));}
});
$('allBtn').onclick=()=>{selected=null;drawMinds();$('profile').innerHTML='';loadFeed(true)};
for(const [id,f] of [['allBtn','all'],['decBtn','decision'],['storyBtn','story']])
  $(id).addEventListener('click',()=>{filter=f;for(const b of ['allBtn','decBtn','storyBtn'])$(b).setAttribute('aria-pressed',b===id);drawFeed()});
$('more').onclick=()=>loadFeed(false);
$('start').onclick=async()=>{try{
  await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({minutes:Number($('minutes').value),count:Number($('mindCount').value)})});
  await api('/api/start',{method:'POST'});
}catch(e){alert(e.message)}tick()};
$('stop').onclick=async()=>{await api('/api/stop',{method:'POST'});tick()};
async function writeNovel(cid){
  if(!confirm('เริ่มแต่งนิยายจากชีวิตตัวละครที่เลือก? โลกจะพักระหว่างใช้โมเดลเขียนนิยาย'))return;
  try{await api('/api/novel/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cid,chapters:Number($('chapters').value)})});}
  catch(e){alert(e.message)}tick();
}
tick();loadFeed(true);setInterval(tick,3000);
</script></body></html>
