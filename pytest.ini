[pytest]
# out/ คือผลลัพธ์ที่เทสต์และเครื่องมือเขียน (ซิมชั่วคราว นิยาย สำเนาโค้ดที่ archive ไว้) — ห้าม collect เด็ดขาด
# tools/ มีสคริปต์ตรวจ (test_system_integrity.py) ที่รันแยกด้วย python โดยตรง ไม่ใช่เทสต์ของ pytest
norecursedirs = out tools .git .claude __pycache__ datasets loras merged vendor_llama_cpp_convert docs
# รันขนาน (-n 4) ต้องให้ทั้งไฟล์อยู่บน worker เดียว: เทสต์ในไฟล์แบบสคริปต์ใช้ซิมร่วม (fixture scope=module)
# และต้องเดินตามลำดับของ main() — ถ้า xdist แจกรายเทสต์ (--dist load) ซิมจะถูกเดินซ้ำทุก worker และลำดับพัง
# ไม่ใส่ -n ไว้ที่นี่: รันแบบไม่ขนาน (เช่นตอนหาลำดับที่รบกวนกัน) ต้องทำได้เหมือนเดิม — สั่ง -n 4 เองตอนรัน
# สองชุด (แยกด้วย marker longrun — เกณฑ์ที่ต้องเดินโลกยาวใน test_world_coherence.py ชื่อมีคำว่า longrun):
#   ชุดเร็ว (ค่าตั้ง):  python -m pytest -q -n 4
#   ชุดเต็ม:           python -m pytest -q -n 4 -m "longrun or not longrun"
#   เฉพาะเกณฑ์โลกยาว:   python -m pytest -q -n 4 -m longrun test_world_coherence.py
# (-m ที่สั่งเองตอนรันมาทีหลัง จึงทับ -m "not longrun" ของค่าตั้งนี้)
markers =
    longrun: เกณฑ์ที่ต้องเดินโลกยาว (seed 11 200 ปี, seed 16 400 ปี) — อยู่ในชุดเต็มเท่านั้น
addopts = --dist loadfile -m "not longrun"
